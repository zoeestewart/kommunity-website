name: Deploy to cPanel

on:
  push:
    branches: [ main ]

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "103.254.137.129 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC/2Cyzck0b6ImNyWGoenYUlmKuP1d2Y/XlWztrNGYNM" >> ~/.ssh/known_hosts
          printf 'Host cpanel\n  HostName 103.254.137.129\n  User kommunit\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config

      # The kommunity site lives directly in public_html, next to the vet site
      # folders. This only adds/overwrites files from dist/, so nothing else in
      # public_html is touched, then removes old build files from assets/.
      - name: Deploy to cPanel
        env:
          TARGET: public_html
        run: |
          tar -C dist -czf - . | ssh cpanel "tar -C $TARGET --no-overwrite-dir -xzf -"
          ls dist/assets | ssh cpanel "k=\$(mktemp) && cat > \$k && cd $TARGET/assets && ls -A | grep -vxF -f \$k | xargs -r rm -f --; rm -f \$k"
